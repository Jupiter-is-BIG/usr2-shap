defaults:
  - data: default
  - debug: no_debug
  - decode: default
  - logger: default
  - logging: default
  - model: default
  - shap: default
  - trainer: test
hydra:
  output_subdir: null
  run:
    dir: .
project_name: usr2_shap
num_workers: 4
log_wandb: False
# The SHAP loop calls encoder/decoder submodule methods directly, never the
# top-level compiled forward(), so torch.compile buys nothing here -- off by
# default to keep startup simple. (Checkpoint loading is correct either way:
# shap_evaluator.py loads weights into the plain module before optionally
# compiling, so a checkpoint saved from a compiled model still loads right.)
compile_model: False
gpus:
